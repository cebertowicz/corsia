name: Feature request
description: Propose a new capability (bigger work — multi-slice or initiative-shaped). For small polish, use "Enhancement" instead.
title: "[feature] <one-line summary>"
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        **Feature vs Enhancement.** A *feature* is a new capability — typically multi-slice, possibly initiative-shaped. An *enhancement* is a small refinement to something that already exists. If this would land in a single small PR, file an [Enhancement](?template=enhancement.yml) instead.
  - type: textarea
    id: what
    attributes:
      label: What would you like to see
      description: The capability, in one paragraph. What can a user do that they can't today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve? What's the user journey today, what does it look like with this in place?
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Capability or area (if known)
      description: Name the user-facing capability or code area. Leave blank if unsure.
      placeholder: review lifecycle
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this. Why this one?
  - type: textarea
    id: success
    attributes:
      label: How would we know it works
      description: What KPI moves, what scenario passes, what a user can now do.
