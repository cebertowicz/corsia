name: Close issues on dev merge

# GitHub only auto-closes issues when a PR merges into the default branch
# (main). Fixes here land on dev, so Closes/Fixes/Resolves keywords in PR
# bodies never fired and issues rotted open (issue #2047). This workflow
# reproduces the keyword semantics on merges into dev and comments the merge
# SHA. "Refs #N" never closes; partial fixes stay open by design.

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

concurrency:
  group: close-on-dev-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-referenced:
    name: Close issues named in the merged PR body
    if: github.event.pull_request.merged == true
    # Self-hosted: GitHub-hosted runners bill paid Actions minutes. Moving this
    # job to a hosted runner needs the repository owner's explicit approval.
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 5
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Close referenced issues
        run: python3 scripts/close_referenced_issues.py
