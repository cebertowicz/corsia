name: LLM evals (L4)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'evals/**'
      - 'scripts/eval-local'
      - 'requirements*.txt'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-evals:
    name: Cache evals (local oMLX, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CORSIA_ANALYTICS_DISABLE: '1'
      CORSIA_PROD_WORKSPACE: ${{ vars.CORSIA_PROD_WORKSPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated workspace
        run: |
          set -e
          echo "CORSIA_WORKSPACE=$RUNNER_TEMP/corsia-ci-workspace" >> "$GITHUB_ENV"
          echo "CORSIA_STATE_DIR=$RUNNER_TEMP/corsia-ci-state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/corsia-ci-workspace/.corsia" "$RUNNER_TEMP/corsia-ci-state"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          set -e
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
          fi
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install -r backend/requirements-test.txt

      - name: Run cache evals on local oMLX (advisory)
        run: |
          bash scripts/eval-local --glob 'cache-C*' cache-warm-baseline || \
            echo "::warning::Cache evals did not fully pass — advisory while the harness is built (#251). Not gating."
