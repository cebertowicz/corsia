name: Integration tests (L3)

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      live_reviewer:
        description: 'Run the bounded real Haiku reviewer proof instead of routine L3'
        type: boolean
        required: false
        default: false

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relevance:
    name: Determine relevance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/relevance
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          patterns: '^backend/|^requirements[^/]*\.txt$|^\.github/workflows/integration\.yml$|^\.github/actions/relevance/action\.yml$'

  integration:
    needs: relevance
    if: ${{ needs.relevance.outputs.relevant == 'true' }}
    name: ${{ inputs.live_reviewer && 'Live host reviewer proof (Haiku)' || 'Integration tests (L3)' }}
    # macOS: the L3 contract suite runs agent shells under Seatbelt
    # (sandbox-exec) and requires Safehouse, neither of which exists on Linux.
    runs-on: macos-15
    timeout-minutes: ${{ inputs.live_reviewer && 30 || 15 }}

    env:
      # A GitHub-hosted runner is a throwaway VM with no CORSIA install, so
      # the HOME-prefix guard (it protects a shared host's live workspace)
      # has nothing to protect; RUNNER_TEMP sits under HOME on these VMs.
      CORSIA_ALLOW_HOME_WORKSPACE_IN_CI: '1'
      CORSIA_ANALYTICS_DISABLE: '1'
      CORSIA_CONTRACT_SUITE: '1'
      CORSIA_REQUIRE_SAFEHOUSE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare isolated workspace
        run: |
          set -e
          echo "CORSIA_WORKSPACE=$RUNNER_TEMP/corsia-ci-workspace" >> "$GITHUB_ENV"
          echo "CORSIA_STATE_DIR=$RUNNER_TEMP/corsia-ci-state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/corsia-ci-workspace/.corsia" "$RUNNER_TEMP/corsia-ci-state"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safehouse
        run: scripts/install-ci-safehouse

      # The stock-CLI receipt proofs drive the real Claude and Codex CLIs
      # against loopback peers; pin the versions they are tested with.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install stock agent CLIs
        run: |
          set -e
          npm install --global @anthropic-ai/claude-code@2.1.296 @openai/codex@0.160.0
          claude --version
          codex --version

      - name: Install backend deps
        run: |
          set -e
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
          fi
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install -r backend/requirements-test.txt

      - name: Check required models loaded
        run: |
          set -e
          cd backend
          ../.venv/bin/python -c "
          import yaml, sys
          from pathlib import Path
          req_file = Path('eval/required_models.yaml')
          if not req_file.exists():
              print('No required_models.yaml — skipping model check')
              sys.exit(0)
          required = yaml.safe_load(req_file.read_text())
          if not required or not required.get('models'):
              print('No models declared in required_models.yaml')
              sys.exit(0)
          for m in required['models']:
              print(f\"  required: {m['id']} ({m.get('reason', 'no reason')})\" )
          print(f\"Validated {len(required['models'])} required model(s)\")
          "

      - name: Run integration tests
        if: ${{ !inputs.live_reviewer }}
        run: |
          set -e
          cd backend
          ../.venv/bin/python -m pytest -m "integration" \
            --ignore=tests/test_host_access_reviewer_live_inference.py \
            --tb=short -q -rs \
            -x

      - name: Run bounded live Haiku reviewer proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_reviewer }}
        run: |
          set -e
          CORSIA_WORKSPACE="$(mktemp -d "$RUNNER_TEMP/reviewer-workspace.XXXXXX")"
          CORSIA_STATE_DIR="$(mktemp -d "$RUNNER_TEMP/reviewer-state.XXXXXX")"
          export CORSIA_WORKSPACE CORSIA_STATE_DIR
          export CORSIA_TEST_MODE=1
          cd backend
          ../.venv/bin/python -m pytest tests/test_host_access_reviewer_live_inference.py \
            --tb=short -q
