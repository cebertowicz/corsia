name: Large files (blocking)

# No path filter on purpose: a large blob is unwanted anywhere in the tree.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: large-files-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  large-files:
    name: No file over 500 KB
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard script tests
        run: |
          python -m venv "$RUNNER_TEMP/large-files-venv"
          "$RUNNER_TEMP/large-files-venv/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/large-files-venv/bin/python" -m pytest scripts/tests/test_check_large_files.py -q

      - name: Added or modified files stay under the limit
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_large_files.py --base "origin/${{ github.base_ref }}"

      - name: Whole tree stays under the limit
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_large_files.py --all
