name: Unit tests (L1)

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    # The Mac Studios finished the three shards in about 6 minutes; a hosted
    # runner has four slower cores, so the cap leaves room for that hardware.
    timeout-minutes: 25
    env:
      # A GitHub-hosted runner is a throwaway VM with no CORSIA install, so
      # the HOME-prefix guard (it protects a shared host's live workspace)
      # has nothing to protect; RUNNER_TEMP sits under HOME on these VMs.
      CORSIA_ALLOW_HOME_WORKSPACE_IN_CI: '1'
      # The 10 GiB pre-migration backup reserve protects a long-lived host's
      # disk; the in-memory test root is about 8 GB and holds only test-sized
      # databases, so a 1 GiB reserve keeps the check without refusing them.
      CORSIA_BACKUP_FREE_FLOOR_BYTES: '1073741824'
      CORSIA_ANALYTICS_DISABLE: '1'
      CORSIA_CONTRACT_SUITE: '1'
      CORSIA_TEST_MODE: '1'
      PYTHONPATH: backend
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether backend unit tests are relevant
        id: relevance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF"...HEAD | grep -Eq '^backend/|^frontend/|^requirements[^/]*\.txt$|^frontend/package[^/]*\.json$|^\.github/workflows/unit-tests\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      # uv's managed CPython bundles the same current SQLite the Mac Python
      # does; setup-python on Ubuntu links the distro's older SQLite, whose
      # parser and query planner differ from what CORSIA runs on.
      - uses: astral-sh/setup-uv@v6
        if: ${{ steps.relevance.outputs.relevant == 'true' }}

      - name: Install deps
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        run: |
          # The search tests assert real ripgrep semantics.
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
          uv venv --python 3.11 --managed-python --seed .venv
          .venv/bin/python -c 'import sqlite3, sys; print(sys.version.split()[0], "SQLite", sqlite3.sqlite_version)'
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install -r backend/requirements-test.txt

      - name: Use in-memory test root
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        # Each SQLite-backed test builds its schema with ~240 commits, and every
        # commit flushes to disk. Test state needs no durability, so keep it in
        # the runner's tmpfs; fall back to RUNNER_TEMP if /dev/shm is missing.
        run: |
          root="$RUNNER_TEMP"
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then
            root="/dev/shm/corsia-ci-l1"
            mkdir -p "$root"
          else
            echo "::warning::/dev/shm unavailable; backend test state stays on disk"
          fi
          echo "CI_TEST_ROOT=$root" >> "$GITHUB_ENV"
          echo "Backend test state root: $root"

      - name: Run backend tests
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        run: |
          set -uo pipefail

          pids=()
          names=()
          run_backend_shard() {
            local shard="$1"
            shift
            local isolated_root="$CI_TEST_ROOT/corsia-ci-backend/${shard}"
            (
              set -e
              export CORSIA_WORKSPACE="$isolated_root/workspace"
              export CORSIA_STATE_DIR="$isolated_root/state"
              mkdir -p "$CORSIA_WORKSPACE/.corsia" "$CORSIA_STATE_DIR"
              .venv/bin/python -c "from infra.database import init_db; init_db()"
              .venv/bin/python -m pytest -c backend/pytest.ini "$@" \
                -m "not integration and not cloud_required" \
                --tb=short -vv -o faulthandler_timeout=60 \
                --basetemp="$isolated_root/pytest" \
                -o tmp_path_retention_policy=failed \
                --durations=50 --durations-min=0.25 \
                --junitxml="$RUNNER_TEMP/backend-junit-${shard}.xml"
            ) > "$RUNNER_TEMP/backend-${shard}.log" 2>&1 &
            pids+=("$!")
            names+=("$shard")
          }

          # Files listed in macos_only_tests.txt run in the macOS job instead,
          # so every test file runs exactly once across the two jobs.
          mapfile -t macos_only < <(grep -v '^[[:space:]]*#' backend/tests/macos_only_tests.txt | grep -v '^[[:space:]]*$')
          macos_ignores=()
          for path in "${macos_only[@]}"; do macos_ignores+=("--ignore=$path"); done
          linux_files() {
            local path macos_path listed
            for path in "$@"; do
              listed=0
              for macos_path in "${macos_only[@]}"; do
                [ "$path" = "$macos_path" ] && listed=1
              done
              [ "$listed" = 0 ] && printf '%s\n' "$path"
            done
            return 0
          }
          mapfile -t cgr_files < <(linux_files backend/tests/test_[cgr]*.py)
          mapfile -t aehilsuw_files < <(linux_files backend/tests/test_[aehilsuw]*.py)

          # One CI job owns all concurrency: three shards on the hosted
          # runner's four cores; worktree agents remain targeted-test only.
          # The letter split keeps the three shards' summed test time within
          # a few percent of each other (measured from the junit reports); a
          # lopsided shard is what pushes the job past its timeout under load.
          run_backend_shard core-cgr "${cgr_files[@]}"
          run_backend_shard remainder backend/tests \
            '--ignore-glob=backend/tests/test_[cgr]*.py' \
            '--ignore-glob=backend/tests/test_[aehilsuw]*.py' \
            "${macos_ignores[@]}"
          run_backend_shard core-aehilsuw "${aehilsuw_files[@]}"

          status=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              status=1
            fi
            echo "::group::Backend shard ${names[$index]}"
            cat "$RUNNER_TEMP/backend-${names[$index]}.log"
            touch "$RUNNER_TEMP/backend-${names[$index]}.log.printed"
            echo "::endgroup::"
          done
          exit "$status"

      - name: Summarize backend test shards
        if: ${{ always() && steps.relevance.outputs.relevant == 'true' }}
        continue-on-error: true
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          shards = [
              path.stem.removeprefix("backend-")
              for path in sorted(runner_temp.glob("backend-*.log"))
          ]
          rows = []
          incomplete_logs = []
          for shard in shards:
              report = runner_temp / f"backend-junit-{shard}.xml"
              try:
                  xml_root = ET.parse(report).getroot()
              except (OSError, ET.ParseError) as error:
                  status = f"unavailable ({type(error).__name__})"
                  rows.append({"shard": shard, "status": status})
                  incomplete_logs.append((shard, status))
                  continue
              suites = (
                  [xml_root]
                  if xml_root.tag == "testsuite"
                  else list(xml_root.findall("testsuite"))
              )
              if not suites:
                  status = "invalid report"
                  rows.append({"shard": shard, "status": status})
                  incomplete_logs.append((shard, status))
                  continue
              counts = {
                  key: sum(int(suite.get(key, 0)) for suite in suites)
                  for key in ("tests", "skipped", "failures", "errors")
              }
              counts.update(
                  shard=shard,
                  status="complete",
                  passed=counts["tests"] - counts["skipped"]
                  - counts["failures"] - counts["errors"],
              )
              rows.append(counts)

          for shard, status in incomplete_logs:
              log = runner_temp / f"backend-{shard}.log"
              if log.with_suffix(".log.printed").exists():
                  continue
              print(
                  f"::group::Incomplete backend shard {shard} log "
                  f"({status}; log follows)"
              )
              try:
                  print(log.read_text(errors="replace"), end="")
              except OSError as error:
                  print(f"::warning::Unable to read {log.name}: {error}")
              print("::endgroup::")

          complete_rows = [row for row in rows if row["status"] == "complete"]
          totals = {
              key: sum(row[key] for row in complete_rows)
              for key in ("tests", "passed", "skipped", "failures", "errors")
          }
          lines = [
              "### Backend test shards",
              "",
              "| Shard | Status | Tests | Passed | Skipped | Failed | Errors |",
              "|---|---|---:|---:|---:|---:|---:|",
          ]
          if not rows:
              lines.append("| _(none discovered)_ | no shard logs | - | - | - | - | - |")
          lines.extend(
              f"| `{row['shard']}` | {row['status']} | {row.get('tests', '-')} | "
              f"{row.get('passed', '-')} | {row.get('skipped', '-')} | "
              f"{row.get('failures', '-')} | {row.get('errors', '-')} |"
              for row in rows
          )
          lines.append(
              f"| **Aggregate** | **{len(complete_rows)}/{len(shards)} reports** | "
              f"**{totals['tests']}** | **{totals['passed']}** | "
              f"**{totals['skipped']}** | **{totals['failures']}** | "
              f"**{totals['errors']}** |"
          )

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")

          print(
              "Backend aggregate: "
              f"{totals['tests']} tests, {totals['passed']} passed, "
              f"{totals['skipped']} skipped, {totals['failures']} failed, "
              f"{totals['errors']} errors from "
              f"{len(complete_rows)}/{len(shards)} reports"
          )
          PY

      - name: Upload backend timing report
        if: ${{ always() && steps.relevance.outputs.relevant == 'true' }}
        # Diagnostics only: a failed upload must not turn a passing job red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/backend-junit-*.xml
            ${{ runner.temp }}/backend-*.log
          if-no-files-found: warn

  backend-macos:
    name: Backend unit tests (macOS-only files)
    # Only the files that need macOS run here; macOS minutes cost more than
    # Linux, so everything else stays in the Linux job above.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CORSIA_ANALYTICS_DISABLE: '1'
      CORSIA_CONTRACT_SUITE: '1'
      CORSIA_TEST_MODE: '1'
      PYTHONPATH: backend
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether macOS-only unit tests are relevant
        id: relevance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF"...HEAD | grep -Eq '^backend/|^frontend/|^requirements[^/]*\.txt$|^frontend/package[^/]*\.json$|^\.github/workflows/unit-tests\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        with:
          python-version: '3.11'

      # The jailed-export cases require the real Safehouse sandbox.
      - name: Install Safehouse
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        run: scripts/install-ci-safehouse

      - name: Install deps
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install -r backend/requirements-test.txt

      - name: Run macOS-only backend tests
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r path; do files+=("$path"); done < <(grep -v '^[[:space:]]*#' backend/tests/macos_only_tests.txt | grep -v '^[[:space:]]*$')
          # Safehouse denies HOME, where RUNNER_TEMP sits, so sandboxed git
          # tests cannot resolve a path there; use the user temp directory.
          tmp_parent="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}"
          tmp_parent="$(cd "$tmp_parent" && pwd -P)"
          isolated_root="$tmp_parent/corsia-ci-backend/macos"
          export CORSIA_WORKSPACE="$isolated_root/workspace"
          export CORSIA_STATE_DIR="$isolated_root/state"
          mkdir -p "$CORSIA_WORKSPACE/.corsia" "$CORSIA_STATE_DIR"
          .venv/bin/python -c "from infra.database import init_db; init_db()"
          .venv/bin/python -m pytest -c backend/pytest.ini "${files[@]}" \
            -m "not integration and not cloud_required" \
            --tb=short -vv -o faulthandler_timeout=60 \
            --basetemp="$isolated_root/pytest" \
            -o tmp_path_retention_policy=failed

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether frontend unit tests are relevant
        id: relevance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF"...HEAD | grep -Eq '^backend/|^frontend/|^requirements[^/]*\.txt$|^frontend/package[^/]*\.json$|^\.github/workflows/unit-tests\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        with:
          # Active LTS; the frontend declares no engines constraint.
          node-version: '24'

      - name: Install deps + run tests
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        working-directory: frontend
        run: |
          npm ci
          npm run test

      - name: Build
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        working-directory: frontend
        run: npm run build

      - name: Type check (svelte-check) — ADVISORY during calibration
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        working-directory: frontend
        continue-on-error: true
        run: npm run check
