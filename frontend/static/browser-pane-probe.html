<!doctype html>
<html lang="en"><head><style>
button, input { position: fixed; left: 0; width: 100%; height: 50%; border: 0; box-sizing: border-box; background: rgb(240, 240, 240); }
@media (prefers-color-scheme: dark) { button, input { background: rgb(30, 30, 30); } }
</style></head><body style="margin:0">
<button id="probe-button" style="top:0" onclick="this.style.background='rgb(0,200,0)'">Click me</button>
<input id="probe-input" aria-label="Probe" style="top:50%" oninput="if (this.value === 'hi') this.style.background = 'rgb(0,0,200)'">
<script>if (location.search === '?navigated') document.getElementById('probe-button').style.background = 'rgb(120,0,160)';</script>
</body></html>
