starter_roster:  # default; max applies to the starter roster; later roles go through conductor-bootstrap roster design
  - {role: conductor, required: true}
  - {role: owner, required: false, max: 1, template: responsibility-template}
scheduled_jobs: []
kpis:  # targets are left per project; each metric id is defined in backend/api/measurement.py REGISTRY
  - id: first_try_acceptance
    definition: Share of outcomes accepted on their first submission
    metric: first_try_acceptance
  - id: rejections_per_outcome
    definition: Rejections per accepted outcome (the correction rate)
    metric: rejections_per_outcome
  - id: fresh_tokens_per_outcome
    definition: Fresh model tokens (cache re-reads excluded) per accepted outcome, including the tokens of worker threads spawned to deliver it (the cost measure; dollars are unavailable because dollar_trend is available=False)
    metric: fresh_tokens_per_outcome
  - id: asks_per_outcome
    definition: Decisions raised to the owner per accepted outcome (attention)
    metric: asks_per_outcome
  - id: active_hours_per_outcome
    definition: Owner active hours per accepted outcome (attention)
    metric: active_hours_per_outcome
tests:  # repo-relative bundled tests; run by the tools pytest gate
  - tools/test_corsia_default_package.py
notes:
  - "COORDINATION-CORE.md is the installed context/COORDINATION-CORE.md without its first line (the origin header)."
  - "The cite to shared/standards/llm-anti-patterns.md #10 in COORDINATION-CORE.md points to an optional file that this version does not ship."
  - "The pinned SPAWN-POLICY.md is selector-free (tier placeholders only) and is filled from the live /api/models at install."
  - "The bundled tests guard the package's structure (placeholder coverage, pins, manifest shape); behavioral evals of the model itself are absent, so the package remains unpublished."
  - "Follow-ups not in this version: standards with an update path, optional/, evals/ (the behavioral evals), repository setup, install script and requires_corsia."
