schema: corsia.pack/1
name: corsia-default
version: "0.1.0"
status: unpublished
summary: Generic coordination rules, charter and safety templates, additive role files, a responsibility template and standard, a routing policy and declared KPIs for a conductor plus at most one owner role
parameters:  # filled by the conductor from the interview (conductor-bootstrap section 2); fills lists the template placeholders each answer feeds
  - {id: project_name, ask: "What is the project called?", fills: [project_name]}
  - {id: owner_name, ask: "Who decides direction for this project?", fills: [owner_name]}
  - {id: purpose, ask: "What outcome, for whom, why now, and what are the long-horizon goals?", fills: [purpose, long_horizon_goals]}
  - {id: objectives, ask: "What are the two or three objectives for the next horizon, how would we know, and which wins when they compete?", fills: [objective_1, objective_2, tie_break_rule]}
  - {id: decision_rights, ask: "What does the owner decide, what may agents decide alone, what is the owner's position, and what may no agent commit the owner to or speak for?", fills: [owner_position, owner_decides, agents_decide_alone, commitment_limits]}
  - {id: standing_risks, ask: "What must never happen?", fills: [additional_invariant]}
  - {id: isolation, ask: "Which live surfaces must never be edited directly (with examples), where is work developed and from what source, how does it reach the live surface, and which real data must tests never touch (with the disposable substitute, the approved procedure to change it, and the system of record)?", fills: [live_surfaces, live_surface_examples, working_copy, source_of_truth, promotion_route, real_data, disposable_data, real_data_procedure, system_of_record]}
  - {id: non_goals, ask: "What is explicitly not this project?", fills: [non_goals]}
  - {id: canonical_sources, ask: "Where does truth live today (repositories, documents, systems, people)?", fills: [canonical_sources]}
  - {id: tolerances, ask: "How much error, rework, delay and spend can this project tolerate, and which items are zero tolerance?", fills: [error_tolerance, rework_tolerance, delay_tolerance, spend_tolerance, zero_tolerance_items]}
