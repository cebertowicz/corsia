handler:
  kind: instruction
workflow:
  steps:
    - id: brief
      title: Brief a fresh reviewer
      required: true
      check: "reviewer receives the person's words, applicable preferences and corrections, Done when, the result and its sources with the same access, applicable workflow or standards checks, and the author's Could be wrong if lines last; no author reasoning, assumptions or view"
      difficulty: {default: standard}
      instruction: "## Brief"
    - id: check
      title: Check the result independently
      required: true
      by: reviewer
      check: "reviewer lists its own failure possibilities before reading the author's, checks both lists, re-checks at least one fact at its source, checks the result as the person meets it, and returns PASS or failures worst first with where and why, plus unchecked doubts; reviewer changes nothing"
      after: [brief]
      difficulty: {default: standard}
      instruction: "## Check"
    - id: weigh
      title: Weigh and address the findings
      required: false          # close with reason only when the reviewer returned PASS
      workflow: apply-feedback
      check: "apply-feedback completed on the reviewer's findings; anything still open goes into the hand-over"
      after: [check]
      difficulty: {default: standard}
