handler:
  kind: instruction
workflow:
  steps:
    - id: ground
      title: Groundwork
      required: true
      check: "the run's intent holds only Goal and Done when, in the person's terms; this step's evidence holds the whole block, with Reaches, 1 to 3 Could be wrong if lines, Kind of work and First job, and each Assumed line marked checked, wrong, asked or stated"
      difficulty: {default: standard, hard_if: "the work is in a field whose rules the agent does not hold"}
      instruction: "## Ground"
    - id: premortem
      title: Risks
      required: false          # close with reason when nothing is sent outside, hard to undo, large or built on
      after: [ground]
      difficulty: {default: standard}
      instruction: "## Pre-mortem"
    - id: work
      title: Work
      required: true
      check: "the result exists where the person will use it; anything to go outside is a draft; nothing has been sent, published, paid, filed or deleted"
      after: [ground, premortem]
      difficulty: {default: standard}
      instruction: "## Work"
    - id: review
      title: Fresh review
      required: true
      by: reviewer
      check: "a worker that had not seen the work, briefed as skill review-work says, checked the result as that skill says and returned PASS; each failed review came back as a revision whose findings were fixed wherever their cause reached, or rejected with the reason told to the reviewer, before the same reviewer checked again; anything still open goes into the hand-over"
      after: [work]
      difficulty: {default: standard}
      instruction: "## Review"
      quality:
        - {name: pass-then-corrected, good: "no correction from the person against this run within 7 days of a PASS", observed: signal, when: "lagging:7"}
        - {name: accepted-first-try, good: "the person used or approved the result without sending it back; no reply is not acceptance", observed: signal, when: "lagging:7"}
