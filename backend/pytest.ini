[pytest]
markers =
    integration: L3 integration tests (real app, TestClient, ephemeral workspace)
    cloud_required: requires cloud API keys (Anthropic, OpenAI)
    pin_raw_tail_off: pin the raw-tail carry window to zero (boundary-independent mechanics suites)
    contract: delivery-contract invariants (red against pre-collapse code by design; run with -m contract)
    real_harness_cli: opt out of the conftest guard that blocks harness CLI discovery leaves
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
