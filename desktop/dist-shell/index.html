<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>CORSIA</title>
	<!-- Generated from the app design tokens by desktop/scripts/gen-shell-tokens.mjs. -->
	<link rel="stylesheet" href="tokens.css" />
	<style>
		:root { color-scheme: dark light; font-family: var(--font-sans); }
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; -webkit-font-smoothing: antialiased; }
		body { background: color-mix(in srgb, var(--bg-primary) 55%, transparent); color: var(--text-primary); }
		.app {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: var(--space-8) var(--space-7);
			text-align: center;
		}
		.mark {
			width: calc(var(--space-8) * 2);
			height: calc(var(--space-8) * 2);
			margin-bottom: var(--space-6);
			pointer-events: none;
			user-select: none;
			-webkit-user-drag: none;
		}
		h1 {
			max-width: calc(var(--space-8) * 12);
			margin: 0;
			font-size: var(--text-title2);
			font-weight: var(--fw-semibold);
			letter-spacing: var(--ls-title);
			line-height: var(--lh-tight);
			text-wrap: balance;
		}
		.line {
			max-width: calc(var(--space-8) * 8);
			margin: var(--space-2) 0 0;
			color: var(--text-secondary);
			font-size: var(--text-callout);
			line-height: var(--lh-normal);
			text-wrap: pretty;
		}
		.log {
			max-width: calc(var(--space-8) * 12);
			margin: var(--space-3) 0 0;
			color: var(--text-secondary);
			font-size: var(--text-footnote);
			line-height: var(--lh-normal);
		}
		.log code {
			display: block;
			margin-top: var(--space-1);
			overflow-wrap: anywhere;
			font-family: var(--font-mono);
		}
		.spinner {
			width: var(--space-5);
			height: var(--space-5);
			margin-top: var(--space-5);
			border: var(--space-1) solid var(--border);
			border-top-color: var(--accent-line);
			border-radius: var(--radius-circle);
			animation: spin var(--dur-hero-plus) linear infinite;
		}
		@keyframes spin { to { transform: rotate(360deg); } }

		.actions, .background-approval {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: var(--space-1);
			margin-top: var(--space-6);
		}
		.approval-row {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: var(--space-2);
			color: var(--text-secondary);
			font-size: var(--text-callout);
			line-height: var(--lh-normal);
		}
		.approval-check {
			display: inline-flex;
			flex: none;
			width: var(--space-5);
			height: var(--space-5);
			align-items: center;
			justify-content: center;
			border: var(--space-1) solid var(--accent-line);
			border-radius: var(--radius-circle);
			color: transparent;
			font-size: var(--text-footnote);
			line-height: 1;
		}
		.approval-check[data-state="on"] {
			border-color: var(--accent-fill);
			background: var(--accent-fill);
			color: var(--accent-on-fill);
		}
		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}
		button {
			border: 0;
			font: inherit;
			cursor: pointer;
			transition: background var(--dur-tight) var(--ease-snap), opacity var(--dur-tight) var(--ease-snap);
		}
		.primary {
			height: calc(var(--space-7) + var(--space-2));
			padding: 0 var(--space-5);
			border-radius: var(--radius-pill);
			background: var(--accent-fill);
			color: var(--accent-on-fill);
			font-size: var(--text-callout);
			font-weight: var(--fw-semibold);
		}
		.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent-fill) 88%, var(--text-primary)); }
		.secondary {
			height: var(--space-7);
			padding: 0 var(--space-2);
			border-radius: var(--radius-sm);
			background: transparent;
			color: var(--accent-text);
			font-size: var(--text-callout);
			font-weight: var(--fw-semibold);
		}
		.secondary:hover:not(:disabled) { background: var(--accent-wash); }
		button:disabled { cursor: wait; opacity: 0.3; }
		button:focus-visible { outline: var(--space-1) solid var(--accent-wash); outline-offset: var(--space-1); }
		[hidden] { display: none !important; }
		@media (prefers-reduced-motion: reduce) {
			button { transition: none; }
			.spinner { animation: none; }
		}
	</style>
	<script>
		(function () {
			function apply() {
				document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			}
			apply();
			window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', apply);
		})();
	</script>
</head>
<body>
	<div class="app" data-tauri-drag-region>
		<img class="mark" src="corsia-mark.svg" alt="" data-tauri-drag-region />
		<h1 id="status" role="status" aria-live="polite" data-tauri-drag-region>Starting CORSIA…</h1>
		<p id="line" class="line" hidden></p>
		<p id="log" class="log" hidden>Service log<code id="log-path"></code></p>
		<div id="spinner" class="spinner"></div>
		<section id="background-approval" class="background-approval" hidden aria-labelledby="status">
			<div class="approval-row">
				<span id="approval-check" class="approval-check" data-state="off"><span aria-hidden="true">✓</span><span id="approval-state" class="visually-hidden">Off</span></span>
				<span>Keep CORSIA running when the window is closed</span>
			</div>
			<button id="open-login-items" class="primary" type="button">Open Login Items</button>
		</section>
		<div id="actions" class="actions" hidden>
			<button id="failure-login-items" class="secondary" type="button" hidden>Open Login Items</button>
			<button id="retry" class="primary" type="button">Try again</button>
			<button id="set-up-local" class="secondary" type="button" hidden>Set up this computer instead</button>
		</div>
	</div>

	<script>
		(async () => {
			const invoke = window.__TAURI__?.core?.invoke;
			const status = document.getElementById('status');
			const line = document.getElementById('line');
			const log = document.getElementById('log');
			const logPath = document.getElementById('log-path');
			const spinner = document.getElementById('spinner');
			const actions = document.getElementById('actions');
			const backgroundApproval = document.getElementById('background-approval');
			const approvalCheck = document.getElementById('approval-check');
			const approvalState = document.getElementById('approval-state');
			const openLoginItems = document.getElementById('open-login-items');
			const retry = document.getElementById('retry');
			const setUpLocal = document.getElementById('set-up-local');
			const failureLoginItems = document.getElementById('failure-login-items');
			let quitFailure = false;
			// What the primary button does on the card that is showing: the failed launch of a saved remote, or the
			// failed attempt to set this computer up. Null is the plain "start the local service" retry.
			let retryAction = null;
			let approvalPoll;
			let approvalPollInFlight = false;
			let continuationStarted = false;

			function showStarting() {
				quitFailure = false;
				retryAction = null;
				setUpLocal.hidden = true;
				status.textContent = 'Starting CORSIA…';
				line.hidden = true;
				log.hidden = true;
				spinner.hidden = false;
				actions.hidden = true;
				backgroundApproval.hidden = true;
			}

			async function showFailure(why, quitting = false, again = null) {
				clearInterval(approvalPoll);
				quitFailure = quitting;
				retryAction = quitting ? null : again;
				setUpLocal.hidden = true;
				retry.textContent = 'Try again';
				backgroundApproval.hidden = true;
				status.textContent = quitting ? 'CORSIA couldn’t quit' : 'CORSIA couldn’t start';
				line.textContent = quitting ? 'CORSIA couldn’t stop its background service.' : typeof why === 'string' ? why : '';
				line.hidden = !line.textContent;
				log.hidden = false;
				spinner.hidden = true;
				failureLoginItems.hidden = !quitting;
				failureLoginItems.className = quitting ? 'primary' : 'secondary';
				retry.className = quitting ? 'secondary' : 'primary';
				actions.hidden = false;
				try {
					logPath.textContent = await invoke('get_service_log_path');
				} catch {
					logPath.textContent = 'Service log location unavailable';
				}
				retry.disabled = false;
				retry.focus();
			}

			function continueToService(startup, showApproval) {
				if (continuationStarted) return;
				continuationStarted = true;
				clearInterval(approvalPoll);
				status.textContent = 'Starting CORSIA…';
				if (showApproval) {
					approvalCheck.dataset.state = 'on';
					approvalState.textContent = 'On';
					window.setTimeout(() => window.location.replace(startup.url), 600);
					return;
				}
				window.location.replace(startup.url);
			}

			async function showBackgroundApproval() {
				quitFailure = false;
				retryAction = null;
				line.textContent = 'Turn this on so your agents keep working when you close this window.';
				line.hidden = false;
				log.hidden = true;
				spinner.hidden = true;
				actions.hidden = true;
				status.textContent = 'Keep CORSIA running';
				backgroundApproval.hidden = false;
				approvalCheck.dataset.state = 'off';
				approvalState.textContent = 'Off';
				clearInterval(approvalPoll);
				approvalPoll = setInterval(async () => {
					if (approvalPollInFlight || continuationStarted) return;
					approvalPollInFlight = true;
					try {
						const startup = await invoke('start_local_service');
						if (startup.state === 'ready') {
							continueToService(startup, true);
						}
					} catch (_) {
					} finally {
						approvalPollInFlight = false;
					}
				}, 1000);
			}

			// Runs a command that answers like start_local_service: the local service is ready, or needs approval.
			async function startLocal(command, again) {
				if (continuationStarted) return;
				showStarting();
				retry.disabled = true;
				if (!invoke) {
					await showFailure(undefined, false, again);
					return;
				}
				try {
					const startup = await invoke(command);
					if (startup.state === 'ready') {
						continueToService(startup);
					} else {
						await showBackgroundApproval();
					}
				} catch (error) {
					await showFailure(error, false, again);
				}
			}

			const start = () => startLocal('start_local_service', null);

			// Set up this computer instead, and Pair again: the saved remote is forgotten, then this computer's own
			// CORSIA starts. The pairing flow is the one Welcome and Settings already offer from there.
			const setUpThisComputer = () => startLocal('disconnect_remote', setUpThisComputer);

			// Try again on a failed remote: the saved remote is connected once more, and the outcome arrives as the
			// same state pushes as at launch.
			async function retrySavedRemote() {
				if (!invoke) {
					await showFailure(undefined, false, start);
					return;
				}
				retry.disabled = true;
				setUpLocal.disabled = true;
				try {
					await invoke('retry_saved_remote');
				} catch (error) {
					await showFailure(error, false, start);
				} finally {
					setUpLocal.disabled = false;
				}
			}

			async function retryFailure() {
				if (retryAction) return retryAction();
				if (!quitFailure) return start();
				retry.disabled = true;
				status.textContent = 'Stopping CORSIA…';
				try {
					await invoke('retry_quit');
				} catch (_) {
					await showFailure(undefined, true);
				}
			}

			function showRemoteState(state) {
				clearInterval(approvalPoll);
				quitFailure = false;
				retryAction = state.kind === 'key_changed' ? setUpThisComputer : retrySavedRemote;
				backgroundApproval.hidden = true;
				log.hidden = true;
				failureLoginItems.hidden = true;
				spinner.hidden = state.kind !== 'connecting';
				setUpLocal.hidden = !['unreachable', 'incompatible', 'too_old', 'key_changed'].includes(state.kind);
				if (state.kind === 'connecting') {
					status.textContent = `Connecting to ${state.name}…`;
					line.hidden = true;
					actions.hidden = true;
					return;
				}
				status.textContent = state.kind === 'key_changed' ? `${state.name} has changed` : `Can’t open ${state.name}`;
				if (state.kind === 'unreachable') {
					line.textContent = state.cause === 'server' ? 'CORSIA is not listening there. Open CORSIA › Settings › System on that computer.' : 'This computer can’t reach it right now. Check your network, then try again.';
				} else if (state.kind === 'incompatible') {
					line.textContent = state.host ? `This computer has CORSIA ${state.app} and ${state.name} has ${state.host}. Update the older one, then try again.` : `${state.name} has an older CORSIA. Update it, then try again.`;
				} else if (state.kind === 'key_changed') {
					line.textContent = `It isn’t the computer this app paired with. That happens when CORSIA is reset or reinstalled there. If nobody did that, check ${state.name} before you pair again.`;
				} else {
					line.textContent = `${state.name} has an older CORSIA. Update it, then try again.`;
				}
				line.hidden = false;
				retry.className = 'primary';
				retry.textContent = state.kind === 'key_changed' ? 'Pair again' : 'Try again';
				retry.disabled = false;
				actions.hidden = false;
			}

			window.__corsiaShowRemoteState = showRemoteState;
			window.__corsiaShowServiceFailure = showFailure;
			window.__corsiaShowQuitFailure = () => showFailure(undefined, true);
			window.__corsiaShowBackgroundApproval = showBackgroundApproval;
			openLoginItems.addEventListener('click', () => invoke?.('open_login_items'));
			failureLoginItems.addEventListener('click', () => invoke?.('open_login_items'));
			retry.addEventListener('click', retryFailure);
			setUpLocal.addEventListener('click', setUpThisComputer);
			if (window.location.hash === '#background-approval') showBackgroundApproval();
			if (window.location.hash === '#quit-failure') showFailure(undefined, true);
		})();
	</script>
</body>
</html>
