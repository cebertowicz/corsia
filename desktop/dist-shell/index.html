<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>CORSIA</title>
	<style>
		:root {
			color-scheme: dark light;
			font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			height: 100%;
			-webkit-font-smoothing: antialiased;
		}
		/* Theme-aware base. Both modes are translucent enough to let macOS
		   NSVisualEffectView vibrancy (set via tauri.conf windowEffects)
		   show through to the desktop wallpaper, but opaque enough that
		   the picker text remains readable. */
		html[data-theme="dark"] body {
			background: rgba(20, 20, 22, 0.55);
			color: #e8e8ed;
		}
		html[data-theme="light"] body {
			background: rgba(255, 255, 255, 0.55);
			color: #1a1a1e;
		}
		.app {
			min-height: 100vh;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			padding: 80px 32px 48px;
		}
		.mark {
			width: 96px; height: 96px;
			margin-bottom: 28px;
			pointer-events: none;
			user-select: none;
			-webkit-user-drag: none;
		}
		h1 {
			font-size: 22px; font-weight: 600;
			letter-spacing: -0.015em;
			margin-bottom: 8px;
		}
		.lede {
			font-size: 14px;
			margin-bottom: 32px;
			text-align: center; max-width: 380px;
			line-height: 1.5;
		}
		html[data-theme="dark"] .lede { color: #8e8e93; }
		html[data-theme="light"] .lede { color: #6e6e73; }

		.card {
			width: 100%; max-width: 420px;
			border-radius: 12px;
			padding: 20px;
			-webkit-backdrop-filter: blur(40px) saturate(180%);
			backdrop-filter: blur(40px) saturate(180%);
		}
		html[data-theme="dark"] .card {
			background: rgba(28, 28, 31, 0.65);
			border: 1px solid rgba(255, 255, 255, 0.08);
		}
		html[data-theme="light"] .card {
			background: rgba(255, 255, 255, 0.7);
			border: 1px solid rgba(0, 0, 0, 0.08);
		}

		label {
			display: block;
			font-size: 12px; font-weight: 500;
			text-transform: uppercase; letter-spacing: 0.06em;
			margin-bottom: 8px;
		}
		html[data-theme="dark"] label { color: #8e8e93; }
		html[data-theme="light"] label { color: #6e6e73; }

		input {
			width: 100%; height: 36px; padding: 0 12px;
			border-radius: 8px;
			font-size: 14px;
			font-family: inherit;
			outline: none;
			transition: border-color 0.15s, box-shadow 0.15s;
		}
		html[data-theme="dark"] input {
			background: rgba(0, 0, 0, 0.25);
			border: 1px solid rgba(255, 255, 255, 0.12);
			color: #e8e8ed;
		}
		html[data-theme="light"] input {
			background: rgba(255, 255, 255, 0.6);
			border: 1px solid rgba(0, 0, 0, 0.15);
			color: #1a1a1e;
		}
		input:focus {
			border-color: #8b5cf6;
			box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
		}

		.hint { font-size: 11.5px; margin-top: 8px; line-height: 1.5; }
		html[data-theme="dark"] .hint { color: #636366; }
		html[data-theme="light"] .hint { color: #9e9ea3; }

		.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

		button {
			height: 32px; padding: 0 14px;
			border-radius: 8px;
			font-size: 13px; font-weight: 500;
			font-family: inherit; cursor: pointer;
			background: rgba(139, 92, 246, 0.15);
			border: 1px solid rgba(139, 92, 246, 0.4);
			color: #b29bff;
			transition: background 0.15s, border-color 0.15s;
		}
		html[data-theme="light"] button { color: #6d4ce6; }
		button:hover:not(:disabled) {
			background: rgba(139, 92, 246, 0.25);
			border-color: #8b5cf6;
		}
		button:disabled { opacity: 0.4; cursor: not-allowed; }

		.err {
			margin-top: 12px;
			font-size: 12.5px; color: #f87171;
			padding: 8px 10px;
			background: rgba(248, 113, 113, 0.1);
			border: 1px solid rgba(248, 113, 113, 0.3);
			border-radius: 6px;
		}
	</style>
	<script>
		// Apply system theme before paint to avoid flash. Honor user's
		// macOS Light/Dark setting; reapply if they switch while picker is open.
		(function () {
			function apply() {
				const light = window.matchMedia('(prefers-color-scheme: light)').matches;
				document.documentElement.dataset.theme = light ? 'light' : 'dark';
			}
			apply();
			window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', apply);
		})();
	</script>
</head>
<body>
	<!--
		Whole picker is a Tauri drag region (data-tauri-drag-region is the
		Tauri 2 way; -webkit-app-region is Electron-only). Inputs/buttons
		stop the drag automatically since they're interactive form controls.
	-->
	<div class="app" data-tauri-drag-region>
		<!-- Real CORSIA mark — full-color particle SVG, transparent bg. -->
		<img class="mark" src="corsia-mark.svg" alt="CORSIA" data-tauri-drag-region />
		<h1 data-tauri-drag-region>Welcome to CORSIA</h1>
		<p class="lede" data-tauri-drag-region>
			Connect to your CORSIA server to get started. You can change this later.
		</p>
		<div class="card">
			<label for="url">Server URL</label>
			<input
				id="url" type="text"
				placeholder="https://corsia.example.com/"
				autocomplete="url"
				autofocus
			/>
			<div class="hint">
				Use the address of your CORSIA instance — local, on your network, or via Tailscale.
			</div>
			<div class="actions">
				<button id="connect" disabled>Connect</button>
			</div>
			<div id="err" class="err" hidden></div>
		</div>
	</div>

	<script>
		(async () => {
			const tauri = window.__TAURI__;
			const invoke = tauri?.core?.invoke;
			const input = document.getElementById('url');
			const button = document.getElementById('connect');
			const errBox = document.getElementById('err');

			function showErr(msg) {
				errBox.textContent = msg;
				errBox.hidden = false;
			}

			if (!invoke) {
				showErr('Tauri runtime not detected — picker is opening outside the desktop shell.');
				return;
			}

			// If a URL is already saved, jump straight to it. Otherwise show
			// the picker with prefill (user came here via Reset).
			try {
				const saved = await invoke('get_server_url');
				if (saved) {
					window.location.href = saved;
					return;
				}
			} catch { /* fresh install */ }

			function normalize(raw) {
				const trimmed = raw.trim();
				if (!trimmed) return '';
				if (!/^https?:\/\//i.test(trimmed)) return 'http://' + trimmed;
				return trimmed;
			}
			function validate() {
				try {
					const u = new URL(normalize(input.value));
					button.disabled = !(u.protocol === 'http:' || u.protocol === 'https:');
				} catch { button.disabled = true; }
			}
			validate();
			input.addEventListener('input', validate);
			input.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && !button.disabled) connect();
			});
			button.addEventListener('click', connect);

			async function connect() {
				errBox.hidden = true;
				button.disabled = true;
				const url = normalize(input.value);
				try {
					await invoke('set_server_url', { url });
				} catch (e) {
					showErr('Failed to save URL: ' + e);
					button.disabled = false;
					return;
				}
				window.location.href = url;
			}
		})();
	</script>
</body>
</html>
