<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>CORSIA</title>
	<style>
		:root {
			color-scheme: dark light;
			font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
			--surface-dark: rgba(20, 20, 22, 0.55);
			--surface-light: rgba(255, 255, 255, 0.55);
			--text-dark: #e8e8ed;
			--text-light: #1a1a1e;
			--muted-dark: #8e8e93;
			--muted-light: #6e6e73;
			--card-dark: rgba(28, 28, 31, 0.65);
			--card-light: rgba(255, 255, 255, 0.7);
			--border-dark: rgba(255, 255, 255, 0.08);
			--border-light: rgba(0, 0, 0, 0.08);
			--accent-bg: rgba(139, 92, 246, 0.15);
			--accent-border: rgba(139, 92, 246, 0.4);
			--accent-text-dark: #b29bff;
			--accent-text-light: #6d4ce6;
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; -webkit-font-smoothing: antialiased; }
		html[data-theme="dark"] body { background: var(--surface-dark); color: var(--text-dark); }
		html[data-theme="light"] body { background: var(--surface-light); color: var(--text-light); }
		.app {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 80px 32px 48px;
			text-align: center;
		}
		.mark {
			width: 96px;
			height: 96px;
			margin-bottom: 28px;
			pointer-events: none;
			user-select: none;
			-webkit-user-drag: none;
		}
		h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
		.failure { width: 100%; max-width: 420px; margin-top: 24px; }
		.failure-card {
			border-radius: 12px;
			padding: 20px;
			-webkit-backdrop-filter: blur(40px) saturate(180%);
			backdrop-filter: blur(40px) saturate(180%);
		}
		html[data-theme="dark"] .failure-card { background: var(--card-dark); border: 1px solid var(--border-dark); }
		html[data-theme="light"] .failure-card { background: var(--card-light); border: 1px solid var(--border-light); }
		.failure-copy { margin: 0; font-size: 14px; line-height: 1.5; }
		.failure-copy + .failure-copy { margin-top: 8px; }
		html[data-theme="dark"] .failure-copy, html[data-theme="dark"] .log-label { color: var(--muted-dark); }
		html[data-theme="light"] .failure-copy, html[data-theme="light"] .log-label { color: var(--muted-light); }
		.log-label { display: block; margin-top: 16px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
		.log-path { display: block; margin-top: 6px; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
		.actions { display: flex; justify-content: center; margin-top: 20px; }
		button {
			height: 36px;
			padding: 0 16px;
			border: 1px solid var(--accent-border);
			border-radius: 8px;
			background: var(--accent-bg);
			color: var(--accent-text-dark);
			font: 500 13px/1 inherit;
			cursor: pointer;
			transition: background 150ms ease, border-color 150ms ease, opacity 150ms ease;
		}
		html[data-theme="light"] button { color: var(--accent-text-light); }
		button:hover:not(:disabled) { background: rgba(139, 92, 246, 0.25); border-color: #8b5cf6; }
		button:focus-visible { outline: 3px solid rgba(139, 92, 246, 0.35); outline-offset: 3px; }
		button:disabled { cursor: wait; opacity: 0.5; }
		@media (prefers-reduced-motion: reduce) { button { transition: none; } }
	</style>
	<script>
		(function () {
			function apply() {
				document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			}
			apply();
			window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', apply);
		})();
	</script>
</head>
<body>
	<div class="app" data-tauri-drag-region>
		<img class="mark" src="corsia-mark.svg" alt="" data-tauri-drag-region />
		<h1 id="status" role="status" aria-live="polite" data-tauri-drag-region>Starting CORSIA…</h1>
		<section id="failure" class="failure" hidden aria-labelledby="status">
			<div class="failure-card">
				<p class="failure-copy">CORSIA couldn’t start.</p>
				<p id="failure-reason" class="failure-copy" hidden></p>
				<span class="log-label">Service log</span>
				<code id="log-path" class="log-path"></code>
				<div class="actions"><button id="retry" type="button">Try again</button></div>
			</div>
		</section>
	</div>

	<script>
		(async () => {
			const invoke = window.__TAURI__?.core?.invoke;
			const status = document.getElementById('status');
			const failure = document.getElementById('failure');
			const logPath = document.getElementById('log-path');
			const reason = document.getElementById('failure-reason');
			const retry = document.getElementById('retry');

			async function showFailure(why) {
				status.textContent = 'CORSIA couldn’t start';
				reason.textContent = typeof why === 'string' ? why : '';
				reason.hidden = !reason.textContent;
				try {
					logPath.textContent = await invoke('get_service_log_path');
				} catch {
					logPath.textContent = 'Service log location unavailable';
				}
				failure.hidden = false;
				retry.disabled = false;
				retry.focus();
			}

			async function start() {
				status.textContent = 'Starting CORSIA…';
				failure.hidden = true;
				retry.disabled = true;
				if (!invoke) {
					await showFailure();
					return;
				}
				try {
					const startup = await invoke('start_local_service');
					window.location.replace(startup.url);
				} catch (error) {
					await showFailure(error);
				}
			}

			window.__corsiaShowServiceFailure = showFailure;
			retry.addEventListener('click', start);
		})();
	</script>
</body>
</html>
