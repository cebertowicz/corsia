[package]
name = "corsia-desktop"
version = "0.1.0"
description = "Native macOS shell for CORSIA"
authors = ["CORSIA contributors"]
publish = false
repository = "https://github.com/cebertowicz/corsia"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
url = "2"
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Direct objc2 deps for the traffic-light positioning workaround.
# Tauri 2.10's tauri.conf.json `trafficLightPosition` is set in Tao's
# ViewState but only APPLIED inside NSView::drawRect:, which doesn't
# fire reliably on transparent windows with NSVisualEffectView
# windowEffects. We re-apply the inset directly to the NSButton frames
# after the window is shown. See lib.rs for the implementation.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
