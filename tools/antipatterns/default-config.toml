[global]
exclude_globs = [
    "**/__pycache__/**",
    "**/.git/**",
    "**/.venv/**",
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/.build-macos/**",
    "**/bundle/**",
    "**/target/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/.cleanup-audit/**",
    "**/migrations/**",
    "**/site-packages/**",
    "tools/antipatterns/tests/fixtures/**",
]

test_path_globs = [
    "**/tests/**",
    "**/test_*.py",
    "**/*_test.py",
    "**/conftest.py",
    "**/qa/**",
    "**/e2e/**",
]

config_path_globs = [
    "**/config*.py",
    "**/*config.py",
    "**/config/**",
    "**/configs/**",
    "**/settings*.py",
    "**/.env*",
    "**/*.toml",
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/fixtures/**",
    "**/test_fixtures/**",
]

[rules.silent-error-swallow]
enabled = true
severity = "error"

[rules.direct-commit-outside-write-transaction]
enabled = true
severity = "error"

[rules.hardcoded-path-or-id]
enabled = true
severity = "error"
path_patterns = [
    '^/Users/',
    '^/home/',
    '^~/\.corsia',
]
uuid_pattern = '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b'
# Explicit, reviewed per-file exemption: this file legitimately owns a
# canonical copy of a `/Users/` detection pattern (the docs-drift checks
# need it at runtime), mirroring the literal pattern above in this same
# config file. Add a file here only for that reason, not to silence a
# real leak.
allow_files = [
    "scripts/check_docs_drift/home_path.py",
]

[rules.hardcoded-model-name]
enabled = true
severity = "error"
data_file_globs = [
    "**/llm/catalog.py",
    "**/llm/pricing.py",
    "**/llm/capabilities.py",
    "**/llm/local_backends.py",
]
# model_name_pattern = ''

[rules.fallback-chain-masks-error]
enabled = true
severity = "warning"

[rules.missing-public-docstring]
enabled = true
severity = "warning"
include_globs = ["backend/**/*.py", "tools/**/*.py"]

[rules.mock-where-real-needed]
enabled = true
severity = "warning"

[rules.untracked-todo]
enabled = true
severity = "warning"
tracking_marker_patterns = [
    '#\d+',
    'audit-run/session-\d',
    '\(deferred:[^)]+\)',
    '\btask-[a-z0-9-]+\b',
]

[rules.periodic-server-reread]
enabled = true
severity = "error"
include_globs = ["frontend/src/**/*.ts", "frontend/src/**/*.svelte"]
# Known pollers, each tracked by an issue. The list may only shrink: fix the
# poller (emit an event from its producer), then delete its entry.
exclude_globs = [
    # cebertowicz/maestro#3414
    "frontend/src/lib/homeLifecycle.ts",
    "frontend/src/lib/components/VersionOverlay.svelte",
    # cebertowicz/maestro#3415
    "frontend/src/lib/components/StatusBanners.svelte",
    # cebertowicz/maestro#3416
    "frontend/src/lib/components/v7/ProviderModelsBody.svelte",
]
# Reviewed accepted false positives (not debt). Each entry carries its reason.
allow_files = [
    # Deadline-driven refresh at lease expiry, not periodic: the interval is a
    # local clock and the re-read fires once per expired lease, with backoff.
    "frontend/src/lib/components/HostAccessLeaseControl.svelte",
    # Update journey: the timers probe /api/version while the server restarts
    # (nothing can emit an event from a process that is down) and re-read the
    # operation status while an update is in flight, bounded to that window and
    # stopped on the terminal state.
    "frontend/src/lib/update/store.ts",
    # Setup's pre-account local download has no authenticated event stream, and
    # vendor install/sign-in emits no progress event. It polls only while either
    # owned job is active, stops on every terminal state and unmount, and uses
    # models_updated for authenticated source and catalog refreshes.
    "frontend/src/lib/components/SetupScreen.svelte",
]
# server_read_pattern = ''
